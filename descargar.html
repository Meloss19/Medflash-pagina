<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Descargar MedFlash</title>
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
  <style>
    :root {
      --blue: #4b6ef6; --blue-dark: #3456e0; --bg: #f0f2f5; --surface: #ffffff;
      --text: #1a1f36; --muted: #6b7280; --radius: 16px;
    }
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .download-card { background: var(--surface); padding: 40px; border-radius: var(--radius); box-shadow: 0 10px 25px rgba(0,0,0,0.05); text-align: center; max-width: 500px; width: 90%; }
    h1 { margin-bottom: 10px; }
    .platform-box { margin-top: 30px; padding: 20px; border: 1px solid #eee; border-radius: 12px; }
    .btn-group { display: flex; gap: 10px; margin-top: 15px; justify-content: center; }
    .btn { padding: 12px 20px; border-radius: 10px; text-decoration: none; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; transition: 0.2s; }
    .btn-direct { background: var(--blue); color: white; }
    .btn-telegram { background: #24A1DE; color: white; }
    .btn:hover { opacity: 0.9; transform: translateY(-2px); }
  </style>
</head>
<body>
  <div class="download-card">
    <h1>Consigue MedFlash</h1>
    <p style="color: var(--muted)">Elige tu plataforma y el método de descarga preferido.</p>

    <div class="platform-box">
      <h3><i class="ph ph-android-logo"></i> Android (.APK)</h3>
      <div class="btn-group">
        <a href="MedFlash.apk" class="btn btn-direct"><i class="ph ph-download"></i> Directa</a>
        <a href="https://t.me/TuCanal/1" class="btn btn-telegram"><i class="ph ph-telegram-logo"></i> Telegram</a>
      </div>
    </div>

    <div class="platform-box">
      <h3><i class="ph ph-windows-logo"></i> Windows (.EXE)</h3>
      <div class="btn-group">
        <a href="MedFlash_Setup.exe" class="btn btn-direct"><i class="ph ph-download"></i> Directa</a>
        <a href="https://t.me/TuCanal/2" class="btn btn-telegram"><i class="ph ph-telegram-logo"></i> Telegram</a>
      </div>
    </div>

    <p style="margin-top: 30px;"><a href="index.html" style="color: var(--blue); text-decoration: none;">← Volver al inicio</a></p>
  </div>
</body>
</html>
